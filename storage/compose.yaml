# Scratch databases for the live Store contract suite. Do not use production data.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: apilog
      POSTGRES_PASSWORD: local-test-only
      POSTGRES_DB: apilog_test
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apilog -d apilog_test"]
      interval: 2s
      timeout: 5s
      retries: 30
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: local-root-test-only
      MYSQL_USER: apilog
      MYSQL_PASSWORD: local-test-only
      MYSQL_DATABASE: apilog_test
    ports: ["127.0.0.1:53306:3306"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -plocal-root-test-only --silent"]
      interval: 2s
      timeout: 5s
      retries: 60
